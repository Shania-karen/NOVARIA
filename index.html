<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITUniversity</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- Font Awesome for theme icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="container">
    <div class="logo">
      <img src="assets/icons/logo.png" alt="ITU Logo">
    </div>

    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Licence</a>
      <a href="#">Master</a>
      <a href="#">Campus Life</a>
      <a href="#">Simulation</a>
      <a href="#">Contact Us</a>
    </nav>

    <div class="right-actions">
      <!-- Toggle Light/Dark Mode using Font Awesome -->
      <button id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Basculer thème clair/sombre">
        <i id="icon-sun" class="fa-solid fa-sun" aria-hidden="true" title="mode clair"></i>
        <i id="icon-moon" class="fa-solid fa-moon" aria-hidden="true" title="mode sombre" style="display:none;"></i>
      </button>

      <div class="menu-toggle">☰</div>
    </div>
  </div>
</header>

<!-- CONTENU TEMPORAIRE -->
<main style="height:1000px;"></main>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-logo">
      <img src="assets/icons/logo.png" alt="ITU Logo">
  </div>

  <div class="footer-links">
    <a href="#">Home</a>
    <a href="#">Map & Directions</a>
    <a href="#">Contact Info</a>
    <a href="#">About ITU</a>
  </div>

  <p class="copyright">
    Copyright 2025-Novaria
  </p>
</footer>

<!-- Page scripts -->
<script src="./js/scroll-reveal.js" defer></script>

<script>
  // Mobile menu toggle
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.nav');
  toggle.addEventListener('click', () => {
    nav.classList.toggle('active');
  });

  const themeToggle = document.getElementById('theme-toggle');
const body = document.body;
const iconSun = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');

function applyTheme(theme){
  if(theme === 'dark'){
    body.classList.add('dark-mode');
    iconSun.style.display = 'none';
    iconMoon.style.display = 'block';
  } else {
    body.classList.remove('dark-mode');
    iconSun.style.display = 'block';
    iconMoon.style.display = 'none';
  }
}

// Vérifier la préférence sauvegardée
applyTheme(localStorage.getItem('theme') || 'light');

themeToggle.addEventListener('click', () => {
  if(body.classList.contains('dark-mode')){
    applyTheme('light');
    localStorage.setItem('theme','light');
  } else {
    applyTheme('dark');
    localStorage.setItem('theme','dark');
  }
});
</script>

</body>
</html>
