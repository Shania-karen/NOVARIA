<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITUniversity</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="container">
    <div class="logo">
      <img src="assets/icons/logo.png" alt="ITU Logo">
    </div>

    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Licence</a>
      <a href="#">Master</a>
      <a href="#">Campus Life</a>
      <a href="#">Simulation</a>
      <a href="#">Contact Us</a>
    </nav>

    <div class="right-actions">
      <!-- Toggle Light/Dark Mode -->
      <button id="theme-toggle" class="theme-toggle">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 4.75V2M12 22v-2.75M4.75 12H2M22 12h-2.75M5.64 5.64l-1.95-1.95M20.31 20.31l-1.95-1.95M5.64 18.36l-1.95 1.95M20.31 3.69l-1.95 1.95M12 7a5 5 0 100 10 5 5 0 000-10z"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none;">
          <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
        </svg>
      </button>

      <div class="menu-toggle">☰</div>
    </div>
  </div>
</header>

<!-- CONTENU TEMPORAIRE -->
<main style="height:1000px;"></main>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-logo">
      <img src="assets/icons/logo.png" alt="ITU Logo">
  </div>

  <div class="footer-links">
    <a href="#">Home</a>
    <a href="#">Map & Directions</a>
    <a href="#">Contact Info</a>
    <a href="#">About ITU</a>
  </div>

  <p class="copyright">
    Copyright 2025-Novaria
  </p>
</footer>

<script>
  // Mobile menu toggle
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.nav');
  toggle.addEventListener('click', () => {
    nav.classList.toggle('active');
  });

  const themeToggle = document.getElementById('theme-toggle');
const body = document.body;
const iconSun = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');

function applyTheme(theme){
  if(theme === 'dark'){
    body.classList.add('dark-mode');
    iconSun.style.display = 'none';
    iconMoon.style.display = 'block';
  } else {
    body.classList.remove('dark-mode');
    iconSun.style.display = 'block';
    iconMoon.style.display = 'none';
  }
}

// Vérifier la préférence sauvegardée
applyTheme(localStorage.getItem('theme') || 'light');

themeToggle.addEventListener('click', () => {
  if(body.classList.contains('dark-mode')){
    applyTheme('light');
    localStorage.setItem('theme','light');
  } else {
    applyTheme('dark');
    localStorage.setItem('theme','dark');
  }
});
</script>

</body>
</html>
